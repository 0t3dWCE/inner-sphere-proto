<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Inner Sphere — прототип</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 12px; top: 12px; color: #fff; font-size: 13px; line-height: 1.5;
      background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 8px; pointer-events: none;
    }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.55); color: #fff; font-size: 20px; cursor: pointer; text-align: center;
    }
    #overlay small { display: block; margin-top: 10px; font-size: 14px; opacity: .8; }
    #crosshair {
      position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
      border-radius: 50%; background: #fff; opacity: .8; pointer-events: none;
    }
    #settings {
      position: fixed; right: 12px; top: 12px; z-index: 2; color: #fff; font-size: 13px;
      background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 8px; min-width: 230px;
    }
    #settings .title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
    #settings button {
      background: #2b6cb0; color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;
    }
    #settings button:hover { background: #3182ce; }
    #settings label { display: grid; grid-template-columns: 1fr 84px; gap: 8px; align-items: center; margin: 4px 0; }
    #settings input {
      width: 100%; box-sizing: border-box; background: rgba(255,255,255,.12); color: #fff;
      border: 1px solid rgba(255,255,255,.25); border-radius: 4px; padding: 3px 6px; font-size: 13px;
    }
    #settings input:focus { outline: 1px solid #63b3ed; }
    #settings input:disabled { opacity: .45; cursor: not-allowed; }
    #settings .hint { margin-top: 6px; font-size: 11px; opacity: .65; }
    #chat {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3; width: min(520px, 90vw);
    }
    #msg {
      width: 100%; box-sizing: border-box; padding: 10px 14px; font-size: 15px; color: #fff;
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3); border-radius: 10px; outline: none;
    }
    #msg:focus { border-color: #63b3ed; background: rgba(0,0,0,.75); }
    #msg::placeholder { color: rgba(255,255,255,.55); }
    #chat .hint { text-align: center; color: #fff; font-size: 12px; opacity: .75; margin-top: 6px; text-shadow: 0 1px 2px #000; }
    #net {
      position: fixed; left: 12px; top: 58px; z-index: 2; color: #fff; font-size: 13px; line-height: 1.6;
      background: rgba(0,0,0,.45); padding: 6px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    #net button {
      background: #2b6cb0; color: #fff; border: 0; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px;
    }
    #net button:hover { background: #3182ce; }
    #net input {
      width: 110px; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px; padding: 2px 6px; font-size: 13px;
    }
    #net .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    #net .status { opacity: .75; font-size: 12px; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud"></div>
  <div id="net"></div>
  <div id="settings">
    <div class="title">
      <span>Параметры</span>
      <span><button id="clearFow" type="button" title="Забыть разведанное">Туман ↺</button> <button id="reset" type="button">Сброс</button></span>
    </div>
    <form id="params" autocomplete="off"></form>
    <div class="hint" id="lockHint" style="display:none"></div>
    <div class="hint">Esc — отпустить мышь, чтобы редактировать. Значения сохраняются в браузере.</div>
  </div>
  <div id="crosshair"></div>
  <form id="chat" autocomplete="off">
    <input id="msg" maxlength="140" placeholder="Enter — написать сообщение" />
    <div class="hint" id="chatHint">Enter — «слепить» шар из сообщения · клик — бросить туда, куда смотришь</div>
  </form>
  <div id="overlay">
    Клик, чтобы начать
    <small>WASD — ходьба · мышь — обзор · Space — прыжок · Enter — сообщение · Esc — выйти из захвата мыши</small>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
