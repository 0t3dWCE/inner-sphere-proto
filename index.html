        h.armR.rotation.x = Math.sin(ph) * amp * 0.35;         // рука с посохом машет меньше
        h.head.rotation.y = Math.sin(t * 0.7 + h.phase) * 0.4 - h.side * 0.25;   // поглядывает на верблюдов
        h.head.rotation.x = Math.sin(ph * 2) * 0.03;
        h.body.position.y = 0.85 + Math.abs(Math.sin(ph)) * 0.03;
      }
    }
    addEventListener('keyup', e => keys.delete(e.code));
    addEventListener('blur', () => keys.clear());

    // ---------- панель параметров (правый верхний угол) ----------
    const form = document.getElementById('params');
    const inputs = {};
    for (const [key, label, min, max, step] of SCHEMA) {
      const row = document.createElement('label');
      const span = document.createElement('span');
      span.textContent = label;
      const input = document.createElement('input');
      Object.assign(input, { type: 'number', name: key, min, max, step, value: P[key] });
      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        if (!Number.isFinite(v)) return;
        setParam(key, THREE.MathUtils.clamp(v, min, max));
      });
      row.append(span, input);
      form.appendChild(row);
      inputs[key] = input;
    }
    form.addEventListener('submit', e => e.preventDefault());

    function setParam(key, value) {
      if (key === 'EYE') value = Math.min(value, P.R / 2);   // глаза не выше центра сферы
      P[key] = value;
      if (key === 'R') { P.EYE = Math.min(P.EYE, P.R / 2); inputs.EYE.value = P.EYE; applyRadius(); }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(P));
    }
    function syncInputs() { for (const k in inputs) inputs[k].value = P[k]; }

    document.getElementById('clearFow').addEventListener('click', () => { clearExplored(); exploredPct = 0; });
    document.getElementById('reset').addEventListener('click', () => {
      Object.assign(P, DEFAULTS);
      localStorage.removeItem(STORAGE_KEY);
      syncInputs();
      applyRadius();
    });

    const overlay = document.getElementById('overlay');
    overlay.addEventListener('click', () => { initAudio(); renderer.domElement.requestPointerLock(); });
    document.addEventListener('pointerlockchange', () => {
      overlay.style.display = document.pointerLockElement ? 'none' : 'flex';
    });

    const _up = new THREE.Vector3(), _right = new THREE.Vector3(), _move = new THREE.Vector3(), _m = new THREE.Matrix4();

    addEventListener('mousemove', e => {
      if (!document.pointerLockElement) return;
      _up.copy(pos).normalize().negate();
      forward.applyAxisAngle(_up, -e.movementX * P.MOUSE_SENS);
      pitch = THREE.MathUtils.clamp(pitch - e.movementY * P.MOUSE_SENS, -Math.PI * 0.45, Math.PI * 0.45);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const hud = document.getElementById('hud');
    const clock = new THREE.Clock();

    // отладка: ?debug в URL открывает состояние в консоли (window.dbg), напр. dbg.goToCaravan()
    if (location.search.includes('debug')) {
      window.dbg = {
        P, pos, forward, caravan, camera, initAudio, townDir, townObstacles, townToDir, dirToTown,
        biomeAt, BIOME, bioAxis, lakeDir, trees,
        get audio() { return audio; },
        get playerBiome() { return playerBiome; },
        setPitch: v => { pitch = v; },
        // встать в направлении d (единичный вектор) лицом к точке target
        goTo(d, target) {
          pos.copy(d).multiplyScalar(P.R - P.EYE);
          forward.copy(target).sub(d);
        },
        // на опушку леса: в 12 м от границы на стороне травы, лицом к центру леса
        goToForest() {
          const d = bioE1.clone().multiplyScalar(Math.cos(BAND - 12 / P.R)).addScaledVector(bioAxis, Math.sin(BAND - 12 / P.R)).normalize();
          this.goTo(d, bioAxis);
        },
        // на берег озера, лицом к его центру
        goToLake(dist = LAKE_R * P.R + 6) {
          const toStart = bioE1.clone().multiplyScalar(Math.cos(-1.4 + Math.PI / 2)).addScaledVector(bioE2, Math.sin(-1.4 + Math.PI / 2));
          const d = lakeDir.clone().multiplyScalar(Math.cos(dist / P.R)).addScaledVector(toStart, Math.sin(dist / P.R)).normalize();
          this.goTo(d, lakeDir);
        },
        // встать у южных ворот города лицом к нему
        goToTown(dist = TOWN_H + 8) {
          const d = townToDir(0, -dist, new THREE.Vector3());
          pos.copy(d).multiplyScalar(P.R - P.EYE);
          forward.copy(townDir).sub(d);
        },
        // встать в 12 м позади каравана лицом к нему
        goToCaravan() {
          const back = caravan.trail[0].dir;
          pos.copy(back).multiplyScalar(P.R - P.EYE);
          forward.copy(caravan.dir).sub(back);
        },
      };
    }

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);

      // локальный базис: up — к центру сферы, forward — переносим в касательную плоскость
      _up.copy(pos).normalize().negate();
      forward.addScaledVector(_up, -forward.dot(_up)).normalize();
      _right.crossVectors(forward, _up).normalize();

      // ходьба по касательной
      _move.set(0, 0, 0);
      if (keys.has('KeyW') || keys.has('ArrowUp')) _move.add(forward);
      if (keys.has('KeyS') || keys.has('ArrowDown')) _move.sub(forward);
      if (keys.has('KeyD') || keys.has('ArrowRight')) _move.add(_right);
      if (keys.has('KeyA') || keys.has('ArrowLeft')) _move.sub(_right);
      // в воде бредём вдвое медленнее
      if (_move.lengthSq() > 0) pos.addScaledVector(_move.normalize(), P.SPEED * dt * (playerBiome === BIOME.WATER ? 0.45 : 1));
      collideWithTown();
      collideWithTrees();
      playerBiome = biomeAt(_pd.copy(pos).normalize());

      // прыжок: "притяжение" тянет обратно к стенке
      if (jumpH > 0 || jumpV > 0) {
        jumpV -= P.GRAVITY * dt;
        jumpH = Math.max(0, jumpH + jumpV * dt);
        if (jumpH === 0) jumpV = 0;
      }

      // держим игрока на сфере радиуса (R - EYE - jumpH) — это и есть "притяжение к внутренней поверхности"
      pos.setLength(P.R - P.EYE - jumpH);

      // камера: X = right, Y = up, Z = -forward, затем наклон по pitch
      camera.position.copy(pos);
      _m.makeBasis(_right, _up, forward.clone().negate());
      camera.quaternion.setFromRotationMatrix(_m);
      camera.rotateX(pitch);

      updateMessages(dt);
      updateCaravan(dt);
      updateAmbience();

      // небо: радиус R - SKY_H (но не ближе 3 м к глазам), облачность и дрейф
      const skyR = P.R - Math.min(P.SKY_H, P.R - P.EYE - 3);
      sky.visible = P.SKY_H > 0;
      sky.scale.setScalar(skyR);
      skyU.uCoverage.value = P.SKY_CLOUDS;   // uTime — общий с туманом войны (fowUniforms)
      // дымка: линейный туман цвета неба — прячет дальнюю сторону шара и рисует горизонт
      scene.fog.near = P.HAZE * 0.3;
      scene.fog.far = P.HAZE;

      // туман войны: униформы + отметка разведанного, когда отошли достаточно далеко от прошлой отметки
      const fowOn = P.FOW > 0.5;
      fowUniforms.uFowOn.value = fowOn ? 1 : 0;
      fowUniforms.uFowR.value = P.FOW_R * P.R;
      fowUniforms.uWorldR.value = P.R;
      fowUniforms.uMemory.value = P.FOW_MEMORY;
      fowUniforms.uTime.value = clock.elapsedTime;
      fowUniforms.uPlayerDir.value.copy(pos).normalize();
      scene.fog.color.copy(fowOn ? FOW_COLOR : SKY_COLOR);
      if (fowOn) {
        // FOW_R — доля радиуса, т.е. угловой радиус пузыря в радианах; карта разведки от R не зависит
        const moved = lastStampDir.lengthSq() === 0 || lastStampDir.angleTo(fowUniforms.uPlayerDir.value) > P.FOW_R * 0.12;
        if (moved) { stampExplored(fowUniforms.uPlayerDir.value, P.FOW_R); lastStampDir.copy(fowUniforms.uPlayerDir.value); }
        if (++pctFrame % 60 === 0) exploredPct = exploredPercent();
      }

      hud.textContent =
        `R=${P.R}  |  позиция: ${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)}` +
        `  |  высота над стенкой: ${jumpH.toFixed(2)}  |  табличек: ${plaques.length}` +
        (fowOn ? `  |  разведано: ${exploredPct.toFixed(1)}%` : '') +
        `  |  караван: ${(caravan.dir.angleTo(fowUniforms.uPlayerDir.value) * P.R).toFixed(0)} м` +
        `  |  город: ${(townDir.angleTo(fowUniforms.uPlayerDir.value) * P.R).toFixed(0)} м` +
        `  |  под ногами: ${BIOME_NAME[playerBiome]}`;

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
